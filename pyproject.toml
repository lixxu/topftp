[project]
name = "topftp"
authors = [{ name = "Lix Xu", email = "xuzenglin@gmail.com" }]
description = "a package on top of ftplib to use FTP easily"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["ftp"]
license-files = ["LICENSE.txt"]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Development Status :: 5 - Production/Stable",
]
dependencies = []
dynamic = ["version"]
[tool.setuptools.dynamic]
version = { attr = "topftp.__version__" }

[project.urls]
"Homepage" = "https://github.com/lixxu/topftp"
"Bug Tracker" = "https://github.com/lixxu/topftp/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
